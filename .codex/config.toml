# Absolute paths intentionally select this repository's pinned Node runtime.
# This shadows the inherited autoConnect registration without editing global config.
[mcp_servers.chrome-devtools]
command = "/Users/admin/persona/hustle/threads-private-api/node_modules/node/bin/node"
args = [
  "/Users/admin/persona/hustle/threads-private-api/node_modules/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js",
  "--isolated",
  "--redact-network-headers",
  "--no-usage-statistics",
  "--no-performance-crux"
]
startup_timeout_sec = 30

[mcp_servers.rea]
command = "/Users/admin/persona/hustle/threads-private-api/node_modules/node/bin/node"
args = [
  "/Users/admin/persona/hustle/threads-private-api/node_modules/rea-agents/scripts/rea.mjs",
  "mcp"
]
startup_timeout_sec = 30

[mcp_servers.rea.env]
SDKROOT = "/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk"
