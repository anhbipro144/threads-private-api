name: Package checks and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '10.28.2'
          run_install: false
      - run: pnpm install --frozen-lockfile --no-optional
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:package
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "require('node:assert/strict').equal(process.env.RELEASE_TAG, 'v' + require('./package.json').version)"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: |
            .artifacts/*.tgz
            .artifacts/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: .artifacts
      - name: Publish verified GitHub bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" .artifacts/*.tgz .artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" \
            --notes-file .github/release-notes.md "${flags[@]}"
